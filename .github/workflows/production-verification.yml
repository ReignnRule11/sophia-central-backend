name: Production verification

on:
  pull_request:
    branches: [main]
  push:
    branches:
      - hardening/p0-production-security
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: ci_sophia
          POSTGRES_PASSWORD: ci-only-not-a-secret
          POSTGRES_DB: sophia_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U ci_sophia -d sophia_ci"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DB_HOST: 127.0.0.1
      DB_PORT: 5432
      DB_USERNAME: ci_sophia
      DB_PASSWORD: ci-only-not-a-secret
      DB_DATABASE: sophia_ci
      DB_SSL: "false"
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Build
        run: npm run build
      - name: Unit tests
        run: npm test -- --runInBand
      - name: Run migrations against fresh PostgreSQL
        env:
          NODE_ENV: production
        run: npm run migration:run
      - name: Verify migrated schema and foreign-key behavior
        run: npm run migration:smoke
      - name: Lint production authentication and security code
        if: always()
        env:
          ESLINT_USE_FLAT_CONFIG: "false"
        run: >-
          npx eslint
          "src/auth/**/*.ts"
          "src/common/security.ts"
          "src/config/typeorm.config.ts"
          "src/database/**/*.ts"
          "src/notifications/**/*.ts"
          "src/resources/entities/resource.entity.ts"
          "src/storage/**/*.ts"
          "src/users/**/*.ts"
          --rule "prettier/prettier: off"
      - name: Dependency security audit
        if: always()
        run: npm audit --omit=dev --audit-level=high
      - name: Docker image build
        if: always()
        run: docker build --tag sophia-central-backend:verification .
      - name: Validate production Compose
        if: always()
        env:
          DB_USERNAME: ci_sophia
          DB_PASSWORD: ci-only-not-a-secret
          DB_DATABASE: sophia_ci
          JWT_SECRET: ci-only-random-looking-secret-value-123456
          CORS_ORIGINS: https://example.invalid
        run: docker compose --env-file /dev/null -f docker-compose.prod.yml config --quiet

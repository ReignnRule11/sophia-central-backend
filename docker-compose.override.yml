version: '3.8'

services:
  minio:
    image: minio/minio:RELEASE.2026-08-31T04-00-00Z
    container_name: minio
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-minioadmin}
    volumes:
      - minio_data:/data
    ports:
      - '9000:9000'
    command: server /data --console-address ":9001"
    healthcheck:
      test: ['CMD', 'curl', '-f', 'http://localhost:9000/minio/health/live']
      interval: 30s
      timeout: 10s
      retries: 5

  minio-console:
    image: minio/console:latest
    container_name: minio-console
    environment:
      MINIO_API: http://minio:9000
    ports:
      - '9001:9001'
    depends_on:
      - minio

  clamav:
    image: mkodockx/docker-clamav:alpine
    container_name: clamav
    ports:
      - '3310:3310'
    volumes:
      - clamav_db:/var/lib/clamav
    healthcheck:
      test: ['CMD', 'clamdscan', '--version']
      interval: 1m
      timeout: 30s
      retries: 3

  ai-scanner:
    build: .
    container_name: ai-scanner
    command: node dist/libs/storage/scanner/worker.js
    environment:
      DATABASE_URL: ${DATABASE_URL}
      S3_ENDPOINT: http://minio:9000
      S3_BUCKET: ${S3_BUCKET:-sophia-dev-bucket}
      S3_REGION: ${S3_REGION:-us-east-1}
      S3_ACCESS_KEY_ID: ${MINIO_ROOT_USER:-minioadmin}
      S3_SECRET_ACCESS_KEY: ${MINIO_ROOT_PASSWORD:-minioadmin}
      CLAMAV_DAEMON_ADDR: clamav:3310
    depends_on:
      - minio
      - clamav
      - db

volumes:
  minio_data:
  clamav_db:

services:
  migrate:
    build:
      context: .
      dockerfile: Dockerfile
    command: ['node', 'dist/database/run-migrations.js']
    restart: 'no'
    environment:
      NODE_ENV: production
      DB_HOST: postgres
      DB_PORT: 5432
      DB_USERNAME: ${DB_USERNAME:?Set DB_USERNAME in the deployment environment}
      DB_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in the deployment environment}
      DB_DATABASE: ${DB_DATABASE:?Set DB_DATABASE in the deployment environment}
      DB_SSL: ${DB_SSL:-false}
    depends_on:
      postgres:
        condition: service_healthy
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL

  api:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    ports:
      # Keep the API private to the host; terminate TLS at a reverse proxy.
      - '127.0.0.1:${PORT:-3000}:3000'
    environment:
      NODE_ENV: production
      PORT: 3000
      DB_HOST: postgres
      DB_PORT: 5432
      DB_USERNAME: ${DB_USERNAME:?Set DB_USERNAME in the deployment environment}
      DB_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in the deployment environment}
      DB_DATABASE: ${DB_DATABASE:?Set DB_DATABASE in the deployment environment}
      DB_SSL: ${DB_SSL:-false}
      JWT_SECRET: ${JWT_SECRET:?Set a strong JWT_SECRET (32+ characters)}
      JWT_EXPIRES_IN: ${JWT_EXPIRES_IN:-1h}
      CORS_ORIGINS: ${CORS_ORIGINS:?Set CORS_ORIGINS to the exact trusted frontend origins}
      SWAGGER_ENABLED: ${SWAGGER_ENABLED:-false}
    depends_on:
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    healthcheck:
      test: ['CMD', 'node', '-e', "fetch('http://127.0.0.1:3000/health').then(r => process.exit(r.status === 200 ? 0 : 1)).catch(() => process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${DB_USERNAME:?Set DB_USERNAME in the deployment environment}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in the deployment environment}
      POSTGRES_DB: ${DB_DATABASE:?Set DB_DATABASE in the deployment environment}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U "$$POSTGRES_USER" -d "$$POSTGRES_DB"']
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

volumes:
  postgres_data:
